<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="劇場量體實驗室：組合多種量體手法，自動生成可容納劇場的建築量體，探索河岸、天橋、鄰棟與屋頂綠化，並可匯出 SketchUp（.dae）與 Rhino（.obj）模型。">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>劇場量體實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: header with language switch; three-step stepper; tabbed control panel at left (tabs change per step); 3D stage at right with stats, area table, log, candidates and export below */
:root{
  --bg:#EEF0EC; --panel:#F8F9F6; --ink:#1C2422; --muted:#5D6965; --line:#CDD3CF;
  --accent:#1D6E86; --accent-ink:#FFFFFF; --theater:#C8552F; --warn:#9A5B12; --ok:#2F7A4B; --bad:#B23A2A;
  --stage:#E2E6E1; --ground:#D3D8D2; --site:#F3F4F0; --zone:#E3EBE2; --road:#B9BEB8; --roadline:#F4F5F1;
  --water:#9EC4D3; --bank:#A9B0AA; --ctx:#C5CAC4; --ctx-west:#B5BBB4;
  --edge:#36413E; --floorline:#8E9893; --mass:#E4E6E0; --core:#8F9792; --slab:#F5F5F1;
  --glass:#BFD8E0; --paving:#E9E6DD; --deck:#C9A57A; --park:#A8C68B; --tree:#557F45;
  --wrap-old:#A9CFD9; --wrap-new:#2E8FA8;
  --os-fore:#E8C98F; --os-corner:#E6B7A0; --os-water:#A9D3DD; --os-court:#C9DDB4; --os-pass:#E3D3B4;
  --p-bigHall:#C8552F; --p-smallHall:#E08A5E; --p-bohF:#7D68A8; --p-bohS:#AE9FD0; --p-lobby:#D8AE3E;
  --p-fohF:#5F9C4C; --p-fohS:#A6CB8B; --p-pub:#3F86B3; --p-com:#CF5F86; --p-semi:#9DB8B0;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root:lang(ja){--f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;--f-display:"Noto Sans JP","Hiragino Sans",sans-serif}
:root:lang(en){--f-body:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;--f-display:"Noto Serif TC",Georgia,serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121716; --panel:#181E1D; --ink:#E2E7E4; --muted:#93A09B; --line:#2C3634;
    --accent:#62B3CC; --accent-ink:#0B1A1F; --theater:#F07A50; --warn:#E3A35A; --ok:#6CC08A; --bad:#F0806E;
    --stage:#0E1312; --ground:#171D1C; --site:#222A28; --zone:#1F2B26; --road:#2B3230; --roadline:#4A5350;
    --water:#22495A; --bank:#39423F; --ctx:#343E3B; --ctx-west:#414C48;
    --edge:#0F1514; --floorline:#66706B; --mass:#B9BFBA; --core:#6E7772; --slab:#CDD2CE;
    --glass:#3E6470; --paving:#6E6B63; --deck:#8C6E4C; --park:#6F8E58; --tree:#3E6332;
    --wrap-old:#5F95A3; --wrap-new:#62C3DC;
    --os-fore:#8E7444; --os-corner:#8A5E4C; --os-water:#3C6B78; --os-court:#56704A; --os-pass:#7A6B52;
    --p-bigHall:#E07850; --p-smallHall:#E9A07A; --p-bohF:#9B88C6; --p-bohS:#C2B6DD; --p-lobby:#E3BE5A;
    --p-fohF:#7FB86C; --p-fohS:#B7D8A0; --p-pub:#5EA2CC; --p-com:#DD7C9E; --p-semi:#7F9C94;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121716; --panel:#181E1D; --ink:#E2E7E4; --muted:#93A09B; --line:#2C3634;
  --accent:#62B3CC; --accent-ink:#0B1A1F; --theater:#F07A50; --warn:#E3A35A; --ok:#6CC08A; --bad:#F0806E;
  --stage:#0E1312; --ground:#171D1C; --site:#222A28; --zone:#1F2B26; --road:#2B3230; --roadline:#4A5350;
  --water:#22495A; --bank:#39423F; --ctx:#343E3B; --ctx-west:#414C48;
  --edge:#0F1514; --floorline:#66706B; --mass:#B9BFBA; --core:#6E7772; --slab:#CDD2CE;
  --glass:#3E6470; --paving:#6E6B63; --deck:#8C6E4C; --park:#6F8E58; --tree:#3E6332;
  --wrap-old:#5F95A3; --wrap-new:#62C3DC;
  --os-fore:#8E7444; --os-corner:#8A5E4C; --os-water:#3C6B78; --os-court:#56704A; --os-pass:#7A6B52;
  --p-bigHall:#E07850; --p-smallHall:#E9A07A; --p-bohF:#9B88C6; --p-bohS:#C2B6DD; --p-lobby:#E3BE5A;
  --p-fohF:#7FB86C; --p-fohS:#B7D8A0; --p-pub:#5EA2CC; --p-com:#DD7C9E; --p-semi:#7F9C94;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 24px;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font-family:var(--f-display);font-size:27px;line-height:1.2;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:72ch}
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.toprow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.langs{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.langs button{background:var(--panel);border:0;border-left:1px solid var(--line);padding:4px 10px;font:500 12.5px var(--f-body);color:var(--muted);cursor:pointer}
.langs button:first-child{border-left:0}
.langs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.help{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 18px;font-size:13px}
.help ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;max-width:96ch}
/* stepper */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.step{display:flex;align-items:center;gap:10px;padding:10px 14px;background:none;border:0;border-left:1px solid var(--line);font:inherit;color:var(--muted);text-align:left;cursor:pointer;min-width:0}
.step:first-child{border-left:0}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:600 13px var(--f-mono)}
.step .tx{display:flex;flex-direction:column;min-width:0}
.step .tx b{font-size:14px;color:inherit}
.step .tx small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step[aria-current=step]{color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,var(--panel));box-shadow:inset 0 -3px 0 var(--accent)}
.step[aria-current=step] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done{color:var(--ink)}
.step.done .n{border-color:var(--accent);color:var(--accent)}
.step:disabled{opacity:.45;cursor:default}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
@media (max-width:640px){.step .tx small{display:none}.step{padding:9px 8px;gap:6px}.step .tx b{font-size:13px}}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.topr{align-items:flex-start}.meta{text-align:left}.toprow{justify-content:flex-start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0}
@media (min-width:961px){.panel{position:sticky;top:12px;max-height:calc(100vh - 24px)}.tabbody{overflow:auto}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 2px 9px;font:500 13px var(--f-body);color:var(--muted);cursor:pointer;letter-spacing:.04em;min-width:0}
.tab[hidden]{display:none}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab:disabled{opacity:.38;cursor:default}
.tab.ref:not(:disabled){color:var(--accent)}
.tab.ref[aria-selected=true]{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.nudge button{padding:5px 0;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:13px var(--f-body);cursor:pointer}
.nudge button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.locks{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.reftitle{font-size:14px;font-weight:700;margin:0}
.reftitle small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.badge{font:500 11px var(--f-body);color:var(--theater);border:1px solid var(--theater);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.up{color:var(--accent)}.down{color:var(--warn)}
.tabbody{flex:1;min-height:0}
.tabp{padding:14px 16px 18px;display:flex;flex-direction:column;gap:20px}
.blk{display:flex;flex-direction:column;gap:10px}
.blk-h{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.mini{font:12px var(--f-body);color:var(--accent);background:none;border:0;cursor:pointer;padding:0 0 0 6px;letter-spacing:0}
.mini:focus-visible{outline:2px solid var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label,.fld>.lb{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.fld output{font-family:var(--f-mono);color:var(--ink)}
input[type=number],select,textarea{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:13px var(--f-mono);min-width:0}
select{font-family:var(--f-body);font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--accent);margin:1px 0}
input[type=checkbox]{accent-color:var(--accent);margin:3px 0 0;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:6px;text-align:center;cursor:pointer;font-size:12.5px;color:var(--muted);background:var(--bg);border-left:1px solid var(--line)}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.faces{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.faces input{position:absolute;opacity:0;pointer-events:none}
.faces label{padding:6px 0;text-align:center;cursor:pointer;font-size:12.5px;color:var(--muted);background:var(--bg);border-left:1px solid var(--line)}
.faces label:first-of-type{border-left:0}
.faces input:checked+label{background:var(--accent);color:var(--accent-ink)}
.faces input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.hint{font-size:12px;color:var(--muted);margin:0}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.op b{font-weight:500}
.op small{display:block;color:var(--muted);font-size:11.5px;line-height:1.4}
.op .sw{margin-top:4px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px}
.chk input{margin:0}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font:12.5px var(--f-body);color:var(--ink);cursor:pointer}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab th{font-weight:500;color:var(--muted);font-size:11.5px;text-align:left;padding:0 4px 4px 0}
.ptab td{padding:3px 4px 3px 0;vertical-align:middle}
.ptab td:first-child{display:flex;align-items:center;gap:6px;min-height:31px}
.ptab input[type=number]{padding:4px 5px;font-size:12px}
.ptab .num{width:76px}.ptab .mul{width:58px}
.ptab tfoot td{border-top:1px solid var(--line);padding-top:6px;font:500 12.5px var(--f-mono)}
.runbar{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 6px 6px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:11px 14px;font:700 15px var(--f-body);cursor:pointer;letter-spacing:.04em}
.primary.stop{background:var(--warn)}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:6px 12px;font:13px var(--f-body);cursor:pointer}
.ghost:disabled{opacity:.45;cursor:default}
.next{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:8px 14px;font:700 13.5px var(--f-body);cursor:pointer}
.next:disabled{opacity:.45;cursor:default}
.next[hidden]{display:none}
.primary:focus-visible,.tbtn:focus-visible,.cand:focus-visible,.ghost:focus-visible,.next:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.stagebox{position:relative;height:clamp(360px,64vh,700px);background:var(--stage);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stagebox canvas#view{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stagebox canvas#view:active{cursor:grabbing}
.tools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:64%}
.trow{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.tbtn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font:12px var(--f-body);cursor:pointer}
.tbtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.cutbox{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px}
.cutbox select{width:auto;padding:2px 4px;font-size:12px}
.cap{position:absolute;top:10px;left:12px;font-size:12px;color:var(--muted);max-width:34%}
.cap b{display:block;color:var(--ink);font-size:15px}
.progbox{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px;max-width:calc(100% - 20px)}
.progbox b{color:var(--ink);font-weight:500}
.legend{position:absolute;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:11px;color:var(--muted);max-width:52%}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.sw.line{height:0;border-top:2px dashed var(--theater);border-radius:0;width:12px}
@media (max-width:700px){.legend{display:none}.cap{max-width:46%}.tools{max-width:58%}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0}
.stats>div{padding:9px 12px;border-right:1px solid var(--line);min-width:0}
.stats>div:last-child{border-right:0}
.stats dt{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stats dd{margin:2px 0 0;font:500 16px var(--f-mono);font-variant-numeric:tabular-nums}
.stats dd.txt{font:500 14px var(--f-body)}
.stats dd small{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.st-pass{color:var(--ok)}.st-partial{color:var(--warn)}.st-fail{color:var(--bad)}.st-none{color:var(--muted)}
.areabox[hidden]{display:none}
.areabox h3{font-size:13px;margin:0 0 8px;letter-spacing:.04em}
.atab{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.atab th{font-weight:500;color:var(--muted);font-size:11.5px;text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
.atab th:first-child,.atab td:first-child{text-align:left}
.atab td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono)}
.atab td:first-child{font-family:var(--f-body);display:flex;align-items:center;gap:7px}
.atab tr.sum td{font-weight:500;border-bottom:0}
.atab .neg{color:var(--bad)}.atab .pos{color:var(--muted)}
.tablewrap{overflow-x:auto}
.detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media (max-width:780px){.detail{grid-template-columns:minmax(0,1fr)}}
.detail h3{font-size:13px;margin:0 0 8px;letter-spacing:.04em}
.oplog{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.oplog li{display:grid;grid-template-columns:7em minmax(0,1fr);gap:8px}
.oplog li b{font-weight:500;color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:12px}
.bar .track{height:8px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--accent)}
.bar.off{opacity:.45}
.bar .v{font:11px var(--f-mono);color:var(--muted);text-align:right}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:15px;margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.cand{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px}
.cand img{width:100%;aspect-ratio:16/10;border-radius:4px;background:var(--stage);display:block;max-width:100%}
.cand .nm{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding:0 2px}
.cand .nm .scv{font:500 13px var(--f-mono);color:var(--accent)}
.cand .sc{font-size:11px;color:var(--muted);padding:0 2px 2px;line-height:1.45}
.cand .pin{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px}
.cand .pin[aria-pressed=true]{color:var(--warn)}
.cand[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:6px;grid-column:1/-1}
.load{border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.load summary{cursor:pointer;padding:9px 12px;font-size:13px;font-weight:500}
.load summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.load .in{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.load textarea,#copyText{height:90px;font-size:11px;resize:vertical}
.msg{font-size:12px;margin:0;color:var(--muted)}
.msg.err{color:var(--warn)}
#copyBox{display:flex;flex-direction:column;gap:6px}
#copyBox[hidden]{display:none}
.note{font-size:12px;color:var(--muted);max-width:96ch;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i18n="app.title"></h1>
      <p class="sub" data-i18n="app.sub"></p>
    </div>
    <div class="topr">
      <div class="toprow">
        <div class="langs" role="group" aria-label="Language / 語言 / 言語">
          <button type="button" data-lang="zh" aria-pressed="true" lang="zh-Hant">中文</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
          <button type="button" data-lang="ja" aria-pressed="false" lang="ja">日本語</button>
        </div>
        <button type="button" class="mini" id="helpBtn" aria-expanded="false" aria-controls="help" data-i18n="help.btn"></button>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </header>
  <div class="help" id="help" hidden><ol id="helpList"></ol></div>

  <nav class="steps" aria-label="Steps" id="steps">
    <button type="button" class="step" data-step="1"><span class="n">1</span><span class="tx"><b data-i18n="st.1"></b><small data-i18n="st.1s"></small></span></button>
    <button type="button" class="step" data-step="2"><span class="n">2</span><span class="tx"><b data-i18n="st.2"></b><small data-i18n="st.2s"></small></span></button>
    <button type="button" class="step" data-step="3"><span class="n">3</span><span class="tx"><b data-i18n="st.3"></b><small data-i18n="st.3s"></small></span></button>
  </nav>

  <main class="layout">
    <form class="panel" id="form" novalidate>
      <div class="tabs" role="tablist" id="tablist">
        <button type="button" class="tab" role="tab" id="tb-cond" data-stage="1" aria-controls="tp-cond" aria-selected="true" data-i18n="tab.cond"></button>
        <button type="button" class="tab" role="tab" id="tb-form" data-stage="1" aria-controls="tp-form" aria-selected="false" tabindex="-1" data-i18n="tab.form"></button>
        <button type="button" class="tab" role="tab" id="tb-open" data-stage="1" aria-controls="tp-open" aria-selected="false" tabindex="-1" data-i18n="tab.open"></button>
        <button type="button" class="tab" role="tab" id="tb-score" data-stage="1" aria-controls="tp-score" aria-selected="false" tabindex="-1" data-i18n="tab.score"></button>
        <button type="button" class="tab ref" role="tab" id="tb-refine" data-stage="1" aria-controls="tp-refine" aria-selected="false" tabindex="-1" disabled data-i18n="tab.refine"></button>
        <button type="button" class="tab" role="tab" id="tb-wrap" data-stage="2" aria-controls="tp-wrap" aria-selected="false" tabindex="-1" hidden data-i18n="tab.wrap"></button>
        <button type="button" class="tab" role="tab" id="tb-w2" data-stage="2" aria-controls="tp-w2" aria-selected="false" tabindex="-1" hidden data-i18n="tab.score"></button>
        <button type="button" class="tab" role="tab" id="tb-prog" data-stage="3" aria-controls="tp-prog" aria-selected="false" tabindex="-1" hidden data-i18n="tab.prog"></button>
        <button type="button" class="tab" role="tab" id="tb-alloc" data-stage="3" aria-controls="tp-alloc" aria-selected="false" tabindex="-1" hidden data-i18n="tab.alloc"></button>
      </div>
      <div class="tabbody">
        <!-- ① 條件 -->
        <section class="tabp" id="tp-cond" role="tabpanel" aria-labelledby="tb-cond">
          <div class="blk"><div class="blk-h" data-i18n="blk.site"></div>
            <div class="g2">
              <div class="fld"><label for="w1" data-i18n="f.w1"></label><input type="number" id="w1" value="80" min="30" max="200" step="1"></div>
              <div class="fld"><label for="w2" data-i18n="f.w2"></label><input type="number" id="w2" value="145" min="30" max="250" step="1"></div>
              <div class="fld"><label for="wr" data-i18n="f.wr"></label><input type="number" id="wr" value="15" min="6" max="40" step="3"></div>
              <div class="fld"><label for="dep" data-i18n="f.dep"></label><input type="number" id="dep" value="60" min="30" max="150" step="1"></div>
            </div>
            <div class="fld"><span class="lb" id="clearLb" data-i18n="f.clear"></span>
              <div class="seg" role="radiogroup" aria-labelledby="clearLb">
                <input type="radio" name="clear" id="clear1" value="1" checked><label for="clear1" data-i18n="f.clear1"></label>
                <input type="radio" name="clear" id="clear2" value="2"><label for="clear2" data-i18n="f.clear2"></label>
              </div>
            </div>
            <div class="fld"><span class="lb" data-i18n="f.crossForms"></span>
              <div class="ops" id="cf1">
                <label class="chk"><input type="checkbox" id="cf_bridge" checked><span data-i18n="cf.bridge"></span></label>
                <label class="chk"><input type="checkbox" id="cf_plate" checked><span data-i18n="cf.plate"></span></label>
                <label class="chk"><input type="checkbox" id="cf_extend" checked><span data-i18n="cf.extend"></span></label>
              </div>
            </div>
            <div class="g3">
              <div class="fld"><label for="sN" data-i18n="f.sN"></label><input type="number" id="sN" value="5" min="0" max="20"></div>
              <div class="fld"><label for="sE" data-i18n="f.sE"></label><input type="number" id="sE" value="5" min="0" max="20"></div>
              <div class="fld"><label for="sW" data-i18n="f.sW"></label><input type="number" id="sW" value="0" min="0" max="20"></div>
              <div class="fld"><label for="sR" data-i18n="f.sR"></label><input type="number" id="sR" value="0" min="0" max="10"></div>
              <div class="fld"><label for="zone" data-i18n="f.zone"></label><input type="number" id="zone" value="9" min="0" max="40"></div>
              <div class="fld"><label for="roadN" data-i18n="f.roadN"></label><input type="number" id="roadN" value="15" min="6" max="60"></div>
              <div class="fld"><label for="river" data-i18n="f.river"></label><input type="number" id="river" value="20" min="8" max="80"></div>
            </div>
            <p class="hint" data-i18n="hint.site"></p>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.floors"></div>
            <div class="g2">
              <div class="fld"><label for="fh" data-i18n="f.fh"></label><input type="number" id="fh" value="5" min="3" max="8" step="0.5"></div>
              <div class="fld"><label for="floors" data-i18n="f.floors"></label><input type="number" id="floors" value="7" min="3" max="30" step="1"></div>
            </div>
            <p class="hint" id="floorHint"></p>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.law"></div>
            <div class="g2">
              <div class="fld"><label for="bcr" data-i18n="f.bcr"></label><input type="number" id="bcr" value="60" min="10" max="100"></div>
              <div class="fld"><label for="far" data-i18n="f.far"></label><input type="number" id="far" value="300" min="50" max="2000" step="10"></div>
            </div>
            <p class="hint" data-i18n="hint.law"></p>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.big"></div>
            <div class="g3">
              <div class="fld"><label for="hBL" data-i18n="f.hL"></label><input type="number" id="hBL" value="50" min="9" max="120"></div>
              <div class="fld"><label for="hBW" data-i18n="f.hW"></label><input type="number" id="hBW" value="38" min="9" max="100"></div>
              <div class="fld"><label for="hBH" data-i18n="f.hH"></label><input type="number" id="hBH" value="25" min="5" max="60"></div>
              <div class="fld"><label for="hBX" data-i18n="f.hBX"></label><input type="number" id="hBX" value="54" min="0" max="250" step="3"></div>
              <div class="fld"><label for="hBY" data-i18n="f.hY"></label><input type="number" id="hBY" value="12" min="0" max="150" step="3"></div>
              <div class="fld"><span class="lb" data-i18n="f.nudge"></span><div class="nudge" data-hall="B"><button type="button" data-d="W" data-i18n-aria="a.W">←</button><button type="button" data-d="N" data-i18n-aria="a.N">↑</button><button type="button" data-d="S" data-i18n-aria="a.S">↓</button><button type="button" data-d="E" data-i18n-aria="a.E">→</button></div></div>
            </div>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.small"></div>
            <div class="g3">
              <div class="fld"><label for="hSL" data-i18n="f.hL"></label><input type="number" id="hSL" value="21" min="9" max="120"></div>
              <div class="fld"><label for="hSW" data-i18n="f.hW"></label><input type="number" id="hSW" value="25" min="9" max="100"></div>
              <div class="fld"><label for="hSH" data-i18n="f.hH"></label><input type="number" id="hSH" value="14" min="5" max="60"></div>
              <div class="fld"><label for="hSX" data-i18n="f.hSX"></label><input type="number" id="hSX" value="48" min="0" max="200" step="3"></div>
              <div class="fld"><label for="hSY" data-i18n="f.hY"></label><input type="number" id="hSY" value="15" min="0" max="150" step="3"></div>
              <div class="fld"><span class="lb" data-i18n="f.nudge"></span><div class="nudge" data-hall="S"><button type="button" data-d="W" data-i18n-aria="a.W">←</button><button type="button" data-d="N" data-i18n-aria="a.N">↑</button><button type="button" data-d="S" data-i18n-aria="a.S">↓</button><button type="button" data-d="E" data-i18n-aria="a.E">→</button></div></div>
            </div>
            <p class="hint" data-i18n="hint.halls"></p>
          </div>
        </section>

        <!-- ① 手法 -->
        <section class="tabp" id="tp-form" role="tabpanel" aria-labelledby="tb-form" hidden>
          <div class="blk"><div class="blk-h" data-i18n="blk.strength"></div>
            <div class="fld"><label for="wild"><span data-i18n="f.wild"></span> <output id="wildO">60</output></label><input type="range" id="wild" min="0" max="100" value="60"></div>
            <p class="hint" data-i18n="hint.wild"></p>
            <div class="fld"><label for="rivOver" data-i18n="f.rivOver"></label><input type="number" id="rivOver" value="5" min="0" max="5" step="0.5"></div>
          </div>
          <div class="blk"><div class="blk-h"><span data-i18n="blk.strat"></span><span><button type="button" class="mini" data-all="b1" data-i18n="mini.all"></button><button type="button" class="mini" data-none="b1" data-i18n="mini.none"></button></span></div>
                        <div class="ops" id="b1">
              <label class="op"><input type="checkbox" id="b_wrap" checked><span><b data-i18n="op.wrap"></b><small data-i18n="opd.wrap"></small></span></label>
              <label class="op"><input type="checkbox" id="b_attach" checked><span><b data-i18n="op.attach"></b><small data-i18n="opd.attach"></small></span></label>
              <label class="op"><input type="checkbox" id="b_plinth" checked><span><b data-i18n="op.plinth"></b><small data-i18n="opd.plinth"></small></span></label>
              <label class="op"><input type="checkbox" id="b_spine" checked><span><b data-i18n="op.spine"></b><small data-i18n="opd.spine"></small></span></label>
              <label class="op"><input type="checkbox" id="b_lift" checked><span><b data-i18n="op.lift"></b><small data-i18n="opd.lift"></small></span></label>
              <label class="op"><input type="checkbox" id="b_cluster" checked><span><b data-i18n="op.cluster"></b><small data-i18n="opd.cluster"></small></span></label>
              <label class="op"><input type="checkbox" id="b_land" checked><span><b data-i18n="op.land"></b><small data-i18n="opd.land"></small></span></label>
              <label class="op"><input type="checkbox" id="b_roof" checked><span><b data-i18n="op.roof"></b><small data-i18n="opd.roof"></small></span></label>
            </div>
          </div>
          <div class="blk"><label class="chk"><input type="checkbox" id="secondary" checked><span data-i18n="f.secondary"></span></label><p class="hint" data-i18n="hint.strat"></p></div>
          <div class="blk"><div class="blk-h"><span data-i18n="blk.fine"></span><span><button type="button" class="mini" data-all="m1" data-i18n="mini.all"></button><button type="button" class="mini" data-none="m1" data-i18n="mini.none"></button></span></div>
            <div class="ops" id="m1">
              <label class="op"><input type="checkbox" id="m_voidl" checked><span><b data-i18n="op.voidl"></b><small data-i18n="opd.voidl"></small></span></label>
              <label class="op"><input type="checkbox" id="m_shiftc" checked><span><b data-i18n="op.shiftc"></b><small data-i18n="opd.shiftc"></small></span></label>
              <label class="op"><input type="checkbox" id="m_perf" checked><span><b data-i18n="op.perf"></b><small data-i18n="opd.perf"></small></span></label>
            </div>
          </div>
        </section>

        <!-- ① 開放空間 -->
        <section class="tabp" id="tp-open" role="tabpanel" aria-labelledby="tb-open" hidden>
          <div class="blk"><div class="blk-h" data-i18n="blk.open"></div>
            <label class="chk"><input type="checkbox" id="osOn" checked><b data-i18n="f.osOn"></b></label>
            <p class="hint" data-i18n="hint.open"></p>
            <div class="fld"><label for="nPlaza"><span data-i18n="f.nPlaza"></span> <output id="nPlazaO">2</output></label><input type="range" id="nPlaza" min="1" max="2" step="1" value="2"></div>
            <div class="ops" id="o1">
              <label class="op"><input type="checkbox" id="oc_cross" checked><i class="sw" style="background:var(--os-fore)"></i><span><b data-i18n="oc.cross"></b><small data-i18n="ocd.cross"></small></span></label>
              <label class="op"><input type="checkbox" id="oc_end" checked><i class="sw" style="background:var(--os-corner)"></i><span><b data-i18n="oc.end"></b><small data-i18n="ocd.end"></small></span></label>
              <label class="op"><input type="checkbox" id="oc_river" checked><i class="sw" style="background:var(--os-water)"></i><span><b data-i18n="oc.river"></b><small data-i18n="ocd.river"></small></span></label>
            </div>
            <label class="chk"><input type="checkbox" id="osStep" checked><span data-i18n="f.osStep"></span></label>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.connect"></div>
            <label class="op"><input type="checkbox" id="os_pass" checked><i class="sw" style="background:var(--os-pass)"></i><span><b data-i18n="os.pass"></b><small data-i18n="osd.pass"></small></span></label>
            <div class="fld"><label for="semiT" data-i18n="f.semiT"></label><input type="number" id="semiT" value="1500" min="0" max="10000" step="50"></div>
            <p class="hint" data-i18n="hint.eave"></p>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.river"></div>
            <label class="chk"><input type="checkbox" id="rv_canti" checked><span data-i18n="riv.canti"></span></label>
            <label class="chk"><input type="checkbox" id="rv_walk" checked><span data-i18n="riv.walk"></span></label>
            <p class="hint" data-i18n="hint.river"></p>
          </div>
        </section>

        <!-- ① 評分 -->
        <section class="tabp" id="tp-score" role="tabpanel" aria-labelledby="tb-score" hidden>
          <div class="blk"><div class="blk-h" data-i18n="blk.presets"></div>
            <div class="presets">
              <button type="button" class="chip" data-preset="balance" data-i18n="pr.balance"></button>
              <button type="button" class="chip" data-preset="open" data-i18n="pr.open"></button>
              <button type="button" class="chip" data-preset="water" data-i18n="pr.water"></button>
              <button type="button" class="chip" data-preset="form" data-i18n="pr.form"></button>
              <button type="button" class="chip" data-preset="city" data-i18n="pr.city"></button>
            </div>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.weights"></div>
            <div class="fld"><label for="wW"><span data-i18n="sc.surr"></span> <output id="wWO">80</output></label><input type="range" id="wW" min="0" max="100" value="80"></div>
            <div class="fld"><label for="wL"><span data-i18n="sc.link"></span> <output id="wLO">80</output></label><input type="range" id="wL" min="0" max="100" value="80"></div>
            <div class="fld"><label for="wR"><span data-i18n="sc.river"></span> <output id="wRO">60</output></label><input type="range" id="wR" min="0" max="100" value="60"></div>
            <div class="fld"><label for="wH"><span data-i18n="sc.hier"></span> <output id="wHO">80</output></label><input type="range" id="wH" min="0" max="100" value="80"></div>
            <div class="fld"><label for="wF"><span data-i18n="sc.fit"></span> <output id="wFO">60</output></label><input type="range" id="wF" min="0" max="100" value="60"></div>
            <div class="fld"><label for="wC"><span data-i18n="sc.clean"></span> <output id="wCO">80</output></label><input type="range" id="wC" min="0" max="100" value="80"></div>
            <div class="fld"><label for="wO"><span data-i18n="sc.open"></span> <output id="wOO">30</output></label><input type="range" id="wO" min="0" max="100" value="30"></div>
            <div class="fld"><label for="wQ"><span data-i18n="sc.osq"></span> <output id="wQO">70</output></label><input type="range" id="wQ" min="0" max="100" value="70"></div>
            <div class="fld"><label for="wP"><span data-i18n="sc.pass"></span> <output id="wPO">30</output></label><input type="range" id="wP" min="0" max="100" value="30"></div>
            <div class="fld"><label for="wV"><span data-i18n="sc.riv"></span> <output id="wVO">30</output></label><input type="range" id="wV" min="0" max="100" value="30"></div>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.evo"></div>
            <div class="fld"><label for="pop"><span data-i18n="f.pop"></span> <output id="popO">8</output></label><input type="range" id="pop" min="6" max="30" step="2" value="8"></div>
            <div class="fld"><label for="gens"><span data-i18n="f.gens"></span> <output id="gensO">20</output></label><input type="range" id="gens" min="10" max="80" step="2" value="20"></div>
            <div class="fld"><label for="divMode" data-i18n="f.divMode"></label><select id="divMode"><option value="species" data-i18n="opt.species"></option><option value="top" data-i18n="opt.top"></option></select></div>
            <label class="chk"><input type="checkbox" id="useHist" checked><span data-i18n="f.useHist"></span></label>
            <p class="hint" data-i18n="hint.evo"></p>
          </div>
        </section>

        <!-- ① 細修 -->
        <section class="tabp" id="tp-refine" role="tabpanel" aria-labelledby="tb-refine" hidden>
          <div class="blk">
            <p class="reftitle" id="refineTitle"></p>
            <p class="hint" data-i18n="hint.refine1"></p>
          </div>
          <div class="blk"><div class="blk-h"><span data-i18n="blk.locks"></span><span class="hint" style="letter-spacing:0;font-weight:400" data-i18n="lk.hint"></span></div>
            <div class="locks">
              <label class="chk"><input type="checkbox" id="lk_mass" checked><span data-i18n="lk.mass"></span></label>
              <label class="chk"><input type="checkbox" id="lk_mods"><span data-i18n="lk.mods"></span></label>
              <label class="chk"><input type="checkbox" id="lk_cross"><span data-i18n="lk.cross"></span></label>
              <label class="chk"><input type="checkbox" id="lk_open"><span data-i18n="lk.open"></span></label>
              <label class="chk"><input type="checkbox" id="lk_river"><span data-i18n="lk.river"></span></label>
            </div>
            <p class="hint" data-i18n="hint.locks"></p>
          </div>
          <div class="blk"><div class="blk-h" data-i18n="blk.amp"></div>
            <div class="seg" style="grid-template-columns:1fr 1fr 1fr" role="radiogroup" data-i18n-aria="blk.amp">
              <input type="radio" name="amp" id="ampS" value="s"><label for="ampS" data-i18n="amp.s"></label>
              <input type="radio" name="amp" id="ampM" value="m" checked><label for="ampM" data-i18n="amp.m"></label>
              <input type="radio" name="amp" id="ampL" value="l"><label for="ampL" data-i18n="amp.l"></label>
            </div>
          </div>
          <div class="blk">
            <button type="button" class="primary" id="refineGo" disabled data-i18n="btn.refineGo"></button>
            <p class="hint" data-i18n="hint.refine2"></p>
          </div>
        </section>

        <!-- ② 包圍 -->
        <section class="tabp" id="tp-wrap" role="tabpanel" aria-labelledby="tb-wrap" hidden>
          <p class="hint" data-i18n="hint.wrap"></p>
          <div class="blk"><div class="blk-h" data-i18n="blk.wrapBig"></div>
            <div class="fld"><span class="lb" data-i18n="f.faces"></span>
              <div class="faces" role="group" data-i18n-aria="f.faces">
                <input type="checkbox" id="wf_big_N"><label for="wf_big_N" data-i18n="face.N"></label>
                <input type="checkbox" id="wf_big_E" checked><label for="wf_big_E" data-i18n="face.E"></label>
                <input type="checkbox" id="wf_big_S"><label for="wf_big_S" data-i18n="face.S"></label>
                <input type="checkbox" id="wf_big_W" checked><label for="wf_big_W" data-i18n="face.W"></label>
              </div>
            </div>
            <div class="g2">

<script>
(function(){

/*CORE-START*/
const CELL=3,CS=3;                                   // 3 m 網格；柱距 3 格（9 m）

const MODS=['voidl','shiftc','perf'];
const RIVS=['canti','walk'];
const OPENS=['fore','corner','water','court','pass'];
const OSC={fore:1,corner:2,water:3,court:4,pass:5};
const OSN=['','fore','corner','water','court','pass'];
const PROGS=['bigHall','smallHall','bohF','bohS','lobby','fohF','fohS','pub','com'];
const PROG_DEF={bigHall:[1900,5],smallHall:[525,3],bohF:[2275,1],bohS:[1700,1],lobby:[1200,2.5],fohF:[1400,1],fohS:[2000,1],pub:[1500,2.25],com:[1250,1.5]};
const SEMI_DEF=[1500,1.5];
const GLEN=120;
const GENE_GROUPS={mass:[[0,42],[96,120]],mods:[[42,60],[85,90]],cross:[[60,64]],open:[[64,80],[90,96]],river:[[80,85]]};

let P={},G={};

/* 基地：西基地＋公共道路＋東基地（正交化，3 m 網格）；x 向東、z 向南 */
function setup(){
  const c=v=>Math.max(1,Math.round(v/CELL));
  G.nW=Math.max(6,c(P.w1));G.nR=c(P.wr);G.nE=Math.max(6,c(P.w2));
  G.nx=G.nW+G.nR+G.nE;G.nzS=Math.max(10,c(P.dep));

  if(G.i1-G.i0<6){G.i0=0;G.i1=G.nx;}if(G.k1-G.k0<6){G.k0=0;G.k1=G.nzS;}

  G.pw=[G.i0,G.r0-G.sr];G.pe=[G.r1+G.sr,G.i1];        // 兩塊基地的可建範圍（x）
  const hall=(id,side,L,Wd,H,ox,oz)=>{
    const tw=Math.max(1,Math.ceil(L/CELL-1e-6)),td=Math.max(1,Math.ceil(Wd/CELL-1e-6)),tl=Math.max(1,Math.min(G.ny,Math.ceil(H/G.fh-1e-6)));

const inRoad=i=>i>=G.r0-G.sr&&i<G.r1+G.sr;
const ix=(i,y,k)=>(y*G.nz+k)*G.nx+i;

const cellA=k=>k>=G.nzS?CELL*G.rv:CELL*CELL;
const occ=v=>v!==0&&v!==COLM;
const inHallFoot=(i,k)=>G.halls.some(H=>i>=H.i&&i<H.i+H.tw&&k>=H.k&&k<H.k+H.td);
const buildable=(i,k)=>i>=G.i0&&i<G.i1&&k>=G.k0&&k<G.k1&&!inRoad(i);
function noise(i,y,k,s){const v=Math.sin(i*12.9898+y*78.233+k*37.719+s*91.17)*43758.5453;return v-Math.floor(v);}
function fill(o,a0,a1,b0,b1,y0,y1,v){
  for(let y=Math.max(0,y0);y<Math.min(G.ny,y1);y++)for(let k=Math.max(0,b0);k<Math.min(G.nz,b1);k++)for(let i=Math.max(0,a0);i<Math.min(G.nx,a1);i++)o[ix(i,y,k)]=v;
}
function rect(gx,gz,gw,gd,minC,frac){
  const m=U5(minC);
  const w=clamp(Math.round(m+gw*(G.bw*frac-m)),m,G.bw),d=clamp(Math.round(m+gd*(G.bd*frac-m)),m,G.bd);
  const x=G.i0+Math.round(gx*(G.bw-w)),z=G.k0+Math.round(gz*(G.bd-d));return [x,x+w,z,z+d];
}
function topY(o){for(let y=G.ny-1;y>=0;y--)for(let k=0;k<G.nz;k++)for(let i=0;i<G.nx;i++)if(occ(o[ix(i,y,k)]))return y+1;return 0;}
function thDims(){const h=G.halls[0];return [h.tw,h.td];}
const seg=(k,p)=>[k,p||{}];

/* ----- 基底手法（六種，每種含兩個變體） ----- */
function genAdd(g,o,st){
  const n=2+Math.floor(g[38]*5);
  for(let b=0;b<n;b++){const q=2+b*6;const [x0,x1,z0,z1]=rect(g[q],g[q+1],g[q+2],g[q+3],2,0.75);
    fill(o,x0,x1,z0,z1,0,1+Math.floor(g[q+4]*(G.ny-1)*(0.35+0.65*G.Wf)),SOL);}
  st.ops.push(['addc',[seg('log.add',{n})]]);
}
function genCluster(g,o,st){
  const n=4+Math.floor(g[2]*6),mg=U5(1);let placed=0;
  for(let j=0;j<n;j++){
    const q=3+j*4,s=U5(2+Math.floor(g[q+2]*3)),h=1+Math.floor(g[q+3]*(1.5+5*G.Wf));
    const x0=G.i0+Math.round(g[q]*(G.bw-s)),z0=G.k0+Math.round(g[q+1]*(G.bd-s));
    let free=true;for(let k=z0-mg;k<z0+s+mg&&free;k++)for(let i=x0-mg;i<x0+s+mg;i++){if(i<0||k<0||i>=G.nx||k>=G.nz)continue;if(o[ix(i,0,k)]){free=false;break;}}
    if(!free)continue;fill(o,x0,x0+s,z0,z0+s,0,h,SOL);placed++;
  }
  st.ops.push(['addc',[seg('log.cluster',{n:placed})]]);
}
function genSub(g,o,st){
  const H0=Math.max(3,2+Math.floor(g[2]*(Math.min(G.ny,9)-2)));
  fill(o,G.i0,G.i1,G.k0,G.k1,0,H0,SOL);
  const n=2+Math.floor(g[33]*5),names=['cut.terrace','cut.court','cut.under','cut.notch'],used={};
  for(let j=0;j<n;j++){
    const q=3+j*5,t=g[q+4]*4,type=Math.floor(t)%4,fr=t-Math.floor(t);
    let [x0,x1,z0,z1]=rect(g[q],g[q+1],g[q+2],g[q+3],2,0.3+0.3*G.Wf);
    if(type===0)fill(o,x0,x1,z0,z1,Math.max(1,Math.floor(fr*H0)),G.ny,0);
    else if(type===1)fill(o,x0,x1,z0,z1,0,G.ny,0);
    else if(type===2)fill(o,x0,x1,z0,z1,0,1,0);
    else{if(fr<0.25)z0=G.k0;else if(fr<0.5)z1=G.k1;else if(fr<0.75)x0=G.i0;else x1=G.i1;fill(o,x0,x1,z0,z1,Math.floor(fr*H0*0.5),G.ny,0);}
    used[names[type]]=(used[names[type]]||0)+1;
  }
  st.ops.push(['subc',[seg('log.sub',{h:H0,cuts:Object.entries(used)})]]);
}
function genCourt(g,o,st){
  const [x0,x1,z0,z1]=rect(g[2],g[3],0.75+0.25*g[4],0.85+0.15*g[5],6,1.0),w=x1-x0,d=z1-z0,m2=U5(2);
  const cw=Math.max(m2,Math.round(w*(0.3+0.3*g[6]))),cd=Math.max(m2,Math.min(d-m2,Math.round(d*(0.35+0.4*g[7]))));
  const cx=x0+Math.round((w-cw)*(0.2+0.6*g[8]));
  const H=v=>1+Math.floor(v*(G.ny-1)*(0.35+0.65*G.Wf));
  const hW=H(g[9]),hN=H(g[10]),hE=H(g[11]);
  fill(o,x0,cx,z0,z1,0,hW,SOL);fill(o,cx,cx+cw,z0,z1-cd,0,hN,SOL);fill(o,cx+cw,x1,z0,z1,0,hE,SOL);
  const sg=[seg('log.court',{w:cw*CELL,d:cd*CELL,a:hW,b:hN,c:hE})];const yl=Math.min(hW,hE)-1;
  if(g[12]>0.55&&yl>=2){fill(o,cx,cx+cw,z1-cd,z1-Math.max(1,Math.floor(cd/2)),yl,yl+1,SOL);sg.push(seg('log.courtBridge',{y:yl+1}));}
  if(g[13]>0.6&&Math.max(hW,hE)>=2){const side=g[14]<0.5;fill(o,side?x0:cx+cw,side?cx:x1,z1-m2,z1,0,1,0);sg.push(seg('log.courtPil',{side:side?'side.W':'side.E'}));}
  st.ops.push(['subc',sg]);
}
function genStack(g,o,st){
  const nl=2+Math.floor(g[2]*4),m3=U5(3);let y=0,prev=null,maxOver=0;
  for(let j=0;j<nl&&y<G.ny;j++){
    const q=3+j*5,th=1+Math.floor(g[q+4]*(1+2.5*G.Wf));let x0,x1,z0,z1;
    if(!prev){[x0,x1,z0,z1]=rect(g[q],g[q+1],g[q+2],g[q+3],4,0.8);}
    else{
      const w=clamp(Math.round(m3+g[q]*(G.bw*(0.45+0.6*G.Wf)-m3)),m3,G.nx),d=clamp(Math.round(m3+g[q+1]*(G.bd*(0.5+0.6*G.Wf)-m3)),m3,G.nz);

function applyOpen(st){
  const o=st.occ,R=st.openR,{nx,nzS,ny}=G;

    const code=OSC[a.type];
    for(let k=Math.max(0,a.z0);k<Math.min(nzS,a.z1);k++)for(let i=Math.max(0,a.x0);i<Math.min(nx,a.x1);i++){
      if(R[k*nx+i]!==code)continue;

      // 到「面向建築的兩條邊」的距離（角落外側兩邊是街道或河岸）
      const dIn=Math.min(a.ax==='L'?a.x1-1-i:i-a.x0,a.az==='N'?a.z1-1-k:k-a.z0);
      for(let y=0;y<ny;y++){
        const keepBand=y>=1?(a.eave||0)+(a.step?Math.floor((y-1)/2)*a.step:0):0;
        if(dIn<keepBand)continue;

      }
    }
  }
  const dist=new Int16Array(nx*nzS).fill(-1),q=[];
  for(let k=0;k<nzS;k++)for(let i=0;i<nx;i++)if(occ(o[ix(i,0,k)])){dist[k*nx+i]=0;q.push(k*nx+i);}
  for(let h=0;h<q.length;h++){const c=q[h],i=c%nx,k=(c-i)/nx;
    for(const [a,b] of [[i+1,k],[i-1,k],[i,k+1],[i,k-1]]){if(a<0||b<0||a>=nx||b>=nzS)continue;const d=b*nx+a;if(dist[d]>=0)continue;dist[d]=dist[c]+1;q.push(d);}}

  }
}

/* 廣場收邊：沿廣場某一邊，若該層已有一半以上是立面，就把缺口補成連續立面 */
function frameFill(st){
  const o=st.occ,R=st.openR,{nx,nzS,ny}=G;

    if(a.type==='pass')continue;

    for(let i=a.x0;i<a.x1;i++){sides[0].push([i,a.z0-1]);sides[1].push([i,a.z1]);}
    for(let k=a.z0;k<a.z1;k++){sides[2].push([a.x0-1,k]);sides[3].push([a.x1,k]);}
    for(const sd of sides){

}
/* 清除只有一格（3 m）厚的薄片量體 */
function thinClean(o){

/* ----- 表演廳、跨路、法規 ----- */

function ensureCrossing(g,st,force){

    let all=true;for(let i=a;i<b;i++)if(!occ(o[ix(i,y,k)])){all=false;break;}

  else{d=Math.min(G.bd,4+Math.floor(g[60]*3));h=Math.min(hMax,2+Math.floor(g[61]*Math.max(1,hMax-1)));kc=clamp(G.k0+Math.round(g[62]*Math.max(0,G.bd-d)),0,G.nzS-d);}

/* 跨路部分佔道路可建深度的比例（取最寬的一層） */
function crossCover(o){

/* 保底：從跨路棟拉一條 12 m 寬的連接量體直到兩個劇場 */
function forceLink(st){

  const y0=X.y0,y1=Math.max(X.y0+2,X.y0+X.h),kc=X.k,d=X.d,a=G.r0-G.sr,b=G.r1+G.sr;

/* 兩館是否經由量體連成一棟 */
function hallsLinked(o){
  const H0=G.halls[0],H1=G.halls[1],{nx,ny,nz}=G,seen=new Uint8Array(G.size),q=[];
  for(let k=H0.k;k<H0.k+H0.td;k++)for(let i=H0.i;i<H0.i+H0.tw;i++){const p=ix(i,0,k);seen[p]=1;q.push(p);}
  for(let h=0;h<q.length;h++){const p=q[h],i=p%nx,r=(p-i)/nx,k=r%nz,y=(r-k)/nz;
    if(i>=H1.i&&i<H1.i+H1.tw&&k>=H1.k&&k<H1.k+H1.td&&y<H1.tl)return true;
    for(const [a,b2,c] of [[i+1,y,k],[i-1,y,k],[i,y+1,k],[i,y-1,k],[i,y,k+1],[i,y,k-1]]){if(a<0||b2<0||c<0||a>=nx||b2>=ny||c>=nz)continue;const n=ix(a,b2,c);if(seen[n]||!occ(o[n]))continue;seen[n]=1;q.push(n);}}

function floorArea(o){

  for(let y=0;y<ny;y++)for(let k=0;k<nz;k++)for(let i=0;i<nx;i++){const v=o[ix(i,y,k)];if(v===SOL||v===CORE)a+=cellA(k);else if(v===TH)th[k*nx+i]=1;}
  for(let c=0;c<nx*nz;c++)if(th[c])a+=2*CELL*CELL;

function footArea(o){

function legal(st){

  let foot=0;const list=[];for(let c=0;c<nx*nz;c++)if(cnt[c]&&!inRoad(c%nx)){foot+=cellA(Math.floor(c/nx));if(!th[c])list.push(c);}

  if(foot>maxFoot+0.01){   // 由外輪廓往內收：每次只移除輪廓上最矮的格子，避免內部被挖成鋸齒
    const alive=new Uint8Array(nx*nz);for(const c of list)alive[c]=1;
    let guard=0;
    while(foot>maxFoot+0.01&&guard++<400){
      const edge=[];for(let c=0;c<nx*nz;c++){if(!alive[c])continue;const i=c%nx,k=(c-i)/nx;
        if(i===0||k===0||i===nx-1||k===nz-1||!cnt[c-1]||!cnt[c+1]||!cnt[c-nx]||!cnt[c+nx])edge.push(c);}
      if(!edge.length)break;edge.sort((a,c)=>cnt[a]-cnt[c]||a-c);
      for(const c of edge.slice(0,Math.max(1,Math.ceil(edge.length/4)))){if(foot<=maxFoot+0.01)break;const i=c%nx,k=(c-i)/nx;
        for(let y=0;y<ny;y++)o[ix(i,y,k)]=0;foot-=cellA(k);cut1+=cellA(k);cnt[c]=0;alive[c]=0;}
    }
  }
  let fa=floorArea(o);
  if(fa>maxFloor){
    const top=new Int16Array(nx*nz).fill(-1);
    const findTop=(c,from)=>{const i=c%nx,k=(c-i)/nx;for(let y=from;y>=0;y--){const p=ix(i,y,k),v=o[p];if(v===TH||prot.has(p))return -1;if(v===SOL||v===CORE)return y;}return -1;};

    while(fa>maxFloor){
      let best=-1,bh=-1;for(let c=0;c<nx*nz;c++)if(top[c]>bh){bh=top[c];best=c;}
      if(best<0)break;

    }
  }
  if(cut1||cut2){const sg=[];if(cut1)sg.push(seg('log.law1',{a:cut1}));if(cut1&&cut2)sg.push(seg('log.semi'));if(cut2)sg.push(seg('log.law2',{a:cut2}));st.ops.push(['law',sg]);}

function placeRiver(g,st){

/* ----- 第一步：解碼與評分 ----- */
function decode(g,base){

/* ----- 第二步：劇場包圍 ----- */

  if(a.stage===3){let d=0,n=0;const la=a.st.tlab,lb=b.st.tlab;for(let p=0;p<la.length;p++){if(la[p]||lb[p]){n++;if(la[p]!==lb[p])d++;}}return n?d/n:0;}
  let d=jdist(a.st.occ,b.st.occ);
  if(a.base!==b.base)d+=0.15;
  if((a.st.river.primary)!==(b.st.river.primary))d+=0.05;
  const os=s=>s.openList.map(x=>x.type+x.x0+','+x.z0).join('|');
  if(os(a.st)!==os(b.st))d+=0.05;
  return d;
}

'hint.alloc':['面積表不會改變形體：空間只分配進既有的量體，多出來的量體保留為彈性空間；一樓空間不足時，先填入既有量體正下方的架空處（外形不變），再允許量體邊緣 6 m 以內的小延伸，超過上限就列為不足。後台靠近各自的表演廳，大廳靠近入口廣場。','The program never reshapes the form: spaces are allocated into the existing mass and spare mass stays as flexible space. Ground-floor shortfalls first infill open space directly under existing mass (silhouette unchanged), then small edge extensions (within 6 m) up to the cap; the rest is listed as short. Backstage sits next to its hall, the lobby next to the entry plaza.','面積表で形を変えません。空間は既存のボリュームに割り当て、余りは予備空間として残します。1 階の不足はまず既存ボリュームの真下のピロティを埋め（外形は不変）、次に縁の小さな増築（6 m 以内、上限あり）で補い、残りは不足として表示します。舞台裏はそれぞれのホールの隣、ロビーはエントランス広場の近くに置きます。'],

function t(key,p){
  const e=DICT[key];let s=e?(e[LI[LANG]]!=null?e[LI[LANG]]:e[0]):key;
  if(p)s=s.replace(/\{(\w+)\}/g,(m,n)=>p[n]==null?'':fmtP(p[n]));
  return s;
}
function fmtP(v){
  if(typeof v==='number')return Number.isInteger(v)?fmtN(v):String(Math.round(v*10)/10);
  if(typeof v==='string')return DICT[v]?t(v):v;
  if(Array.isArray(v)){
    if(v.length===2&&typeof v[0]==='string'&&v[1]&&typeof v[1]==='object'&&!Array.isArray(v[1]))return t(v[0],v[1]);
    return v.map(x=>Array.isArray(x)?(typeof x[1]==='number'?t(x[0])+(x[1]>1?'×'+x[1]:''):t(x[0],x[1])):fmtP(x)).join(SEP());
  }
  return String(v);
}

  const lockG=c=>{if(seed)for(let j=0;j<L;j++)if(lockMask[j])c[j]=seed.g[j];return c;};
  const rand=()=>lockG(Float32Array.from({length:L},()=>Math.random()*0.9999));
  const mutate=(g,s,r)=>{const c=Float32Array.from(g);for(let j=1;j<L;j++)if(Math.random()<r)c[j]=clamp(c[j]+gauss()*s,0,0.9999);return lockG(c);};
  const bases=seed?[seed.base]:(P.bases.length?P.bases:['addc']);
  const per=seed?Math.max(14,P.pop*2):P.pop;
  const hist=!seed&&P.useHist!==false?histLoad().filter(x=>x.env===envSig(P)&&x.g.length===L):[];
  const fromHist=(b,q)=>{const hs=hist.filter(x=>x.base===b).sort((a,c)=>c.score-a.score);return q<Math.min(2,hs.length)?(q===0?lockG(Float32Array.from(hs[q].g)):mutate(Float32Array.from(hs[q].g),0.08,0.2)):null;};
  const islands=bases.map(b=>({base:b,pop:Array.from({length:per},(_,q)=>!seed?(fromHist(b,q)||rand()):q===0?Float32Array.from(seed.g):q<per*0.5?mutate(seed.g,amp.sig*0.5,amp.rate):q<per-2?mutate(seed.g,amp.sig,amp.rate):(mode===2?mutate(seed.g,amp.sig*2,amp.rate):rand()))}));
  const archive=[],best=[];let gen=0,isl=0,top=null;
  S.c[S.stage]=[];S.sel[S.stage]=-1;renderCands();setActions();
  const mSig=seed?amp.sig:0.18,mRate=seed?amp.rate*0.3:0.06,gens=mode===2?Math.max(8,Math.round(P.gens/2)):P.gens;
  const ev=g=>{const st=mode===2?buildStage(2,g,seed.base):decode(g,bases[isl]);return {st,e:mode===2?evaluate2(st,S.ref2):evaluate(st)};};
  const step=()=>{
    if(run!==S.run)return;
    if(S.stop){finish(archive,mode);return;}
    const I=islands[isl];
    const scored=I.pop.map(g=>{const {st,e}=ev(g);archive.push({g,base:I.base,score:e.score});return {g,base:I.base,st,e,score:e.score,stage:mode};});
    scored.sort((a,b)=>b.score-a.score);
    if(!top||scored[0].score>top.score)top=scored[0];
    const pick=()=>{let b=scored[(Math.random()*scored.length)|0];for(let q=0;q<2;q++){const c=scored[(Math.random()*scored.length)|0];if(c.score>b.score)b=c;}return b.g;};
    const next=[scored[0].g];if(per>=6)next.push(scored[1].g);
    while(next.length<per){
      const a=pick(),b=pick(),ch=new Float32Array(L);
      for(const [s0,s1] of XGROUPS){const src=Math.random()<0.5?a:b;for(let q=s0;q<s1;q++)ch[q]=src[q];}
      for(let j=1;j<L;j++)if(Math.random()<mRate)ch[j]=clamp(ch[j]+gauss()*mSig,0,0.9999);
      next.push(lockG(ch));
    }
    if(mode===1){next[next.length-1]=rand();if(per>=10)next[next.length-2]=rand();}
    I.pop=next;
    if(++isl>=islands.length){
      isl=0;gen++;best.push(top.score);showProgress(gen,gens,best,top);
      if(gen===1||gen%2===0){showScheme(top);setCaption(t(seed?(mode===2?'cap.wrapping':'cap.refining'):'cap.best'),methodText(top)+' · '+t('cap.running'));}
      if(gen>=gens){finish(archive,mode);return;}
    }
    setTimeout(step,0);
  };
  setTimeout(step,20);
}
function pickDiverse(list,thr,max){const out=[];for(const c of list){if(out.length>=max)break;if(out.every(x=>candDist(x,c)>=thr))out.push(c);}return out;}
function finish(archive,mode){
  setRunning(false);
  if(!archive.length){toast(t('toast.noResult'));return;}
  archive.sort((a,b)=>b.score-a.score);
  const seenG=new Set(),uniq=[];
  for(const a of archive){const key=a.base+Array.from(a.g.slice(0,12)).map(x=>x.toFixed(4)).join();if(seenG.has(key))continue;seenG.add(key);uniq.push(a);if(uniq.length>=240)break;}
  const chosen=[],thr=S.seed?(mode===2?0.08:0.05):0.2,seenB=new Set();
  const make=a=>{const c=mode===2?mkCand(2,a.g,a.base):mkCand(1,a.g,a.base);return c;};
  const tryAdd=a=>{const c=make(a);if(chosen.every(x=>candDist(x,c)>=thr)){chosen.push(c);return true;}return false;};
  if(P.divMode==='species'&&!S.seed)for(const a of uniq){if(chosen.length>=6)break;if(seenB.has(a.base))continue;seenB.add(a.base);tryAdd(a);}
  for(let q=0;q<uniq.length&&chosen.length<6;q++)tryAdd(uniq[q]);
  if(S.seed){
    const og=S.seed.g,same=c=>c.g.length===og.length&&c.g.every((x,j)=>Math.abs(x-og[j])<1e-9);
    let oc=chosen.find(same);
    if(!oc){oc=mode===2?mkCand(2,Float32Array.from(og),S.seed.base):mkCand(1,Float32Array.from(og),S.seed.base);if(chosen.length>=6)chosen.pop();chosen.push(oc);}
    oc.orig=true;
  }
  chosen.sort((a,b)=>b.e.score-a.e.score);
  chosen.forEach(c=>{c.thumb=renderThumb(c);try{c.thumbJ=thumbR.domElement.toDataURL('image/jpeg',0.55);}catch(e){}});
  S.c[mode]=chosen;renderCands();select(0);
  if(mode===1)histAdd(chosen.slice(0,4));
}
/* 第三步：產生數個配置方案（只改變空間分配，不改變量體） */
function runAlloc(){
  if(!S.pick2)return;
  prepEnv();
  const run=++S.run;S.stop=false;setRunning(true);
  const {g,base}=S.pick2,per=10,gens=12,best=[];
  const rnd=()=>Array.from({length:AGL},()=>Math.random());
  const mut=a=>a.map(x=>Math.random()<0.15?clamp(x+gauss()*0.25,0,0.9999):x);
  let pop=[stdAG(),...Array.from({length:per-1},rnd)],gen=0,all=[];
  S.c[3]=[];S.sel[3]=-1;renderCands();setActions();
  const step=()=>{
    if(run!==S.run)return;
    if(S.stop||gen>=gens){finish3(all);return;}
    const sc=pop.map((ag,q)=>{const c=mkCand(3,g,base,ag);if(gen===0&&q===0)c.orig=true;all.push(c);return c;});
    sc.sort((a,b)=>b.e.score-a.e.score);gen++;
    best.push(Math.max(...all.map(x=>x.e.score)));
    $('#progT').innerHTML=t('prog.alloc',{n:gen,N:gens,s:best[best.length-1].toFixed(3)});spark(best,gens);
    if(gen%3===1)showScheme(sc[0]);
    const pick=()=>{let b=sc[(Math.random()*sc.length)|0];const c=sc[(Math.random()*sc.length)|0];return c.e.score>b.e.score?c.ag:b.ag;};
    const next=[sc[0].ag,sc[1].ag];
    while(next.length<per){const a=pick(),b=pick();next.push(mut(a.map((x,k)=>Math.random()<0.5?x:b[k])));}
    next[per-1]=rnd();pop=next;
    setTimeout(step,0);
  };
  setTimeout(step,20);
}
function finish3(list){
  setRunning(false);
  list.sort((a,b)=>b.e.score-a.e.score);
  const chosen=pickDiverse(list,0.15,6),orig=list.find(c=>c.orig);
  if(orig&&!chosen.includes(orig)){if(chosen.length>=6)chosen.pop();chosen.push(orig);}
  chosen.sort((a,b)=>b.e.score-a.e.score);chosen.forEach(c=>{c.thumb=renderThumb(c);});
  S.c[3]=chosen;renderCands();select(0);
}

/* ---------- 歷史方案（存在這個瀏覽器） ---------- */
const HSTORE='theaterLab.hist.v12',HMAX=30;

const histKey=(base,g)=>base+':'+Array.from(g.slice(2,20)).map(x=>x.toFixed(3)).join(',');

function histRestore(i){

/* ---------- 步驟切換 ---------- */
function goStage(n,fromNext){
  if(S.running)return;
  P=formValues();setup();
  if(S.envKey!==envSig(P)){buildEnv();S.envKey=envSig(P);}
  updateMeta();
  if(n===2){
    if(fromNext){const c=curCand();if(!c)return;S.pick1={g:Float32Array.from(c.g),base:c.base};S.c[2]=[];S.sel[2]=-1;S.c[3]=[];S.sel[3]=-1;S.pick2=null;}
    if(!S.pick1)return;
    S.ref2=decode(S.pick1.g,S.pick1.base).occ;
    if(!S.c[2].length){const c=mkCand(2,S.pick1.g,S.pick1.base);c.orig=true;S.c[2]=[c];S.sel[2]=0;}
    else S.c[2].forEach(recompute);
  }else if(n===3){
    if(fromNext){const c=curCand();if(!c)return;S.pick2={g:Float32Array.from(c.g),base:c.base};S.c[3]=[];S.sel[3]=-1;}
    if(!S.pick2)return;
    S.ref2=decode(S.pick1.g,S.pick1.base).occ;
    if(!S.c[3].length){const c=mkCand(3,S.pick2.g,S.pick2.base,stdAG());c.orig=true;S.c[3]=[c];S.sel[3]=0;}
    else S.c[3].forEach(recompute);
  }else{
    S.c[1].forEach(recompute);
  }
  S.stage=n;
  $('#progT').textContent=t('prog.ready');spark([],1);
  S.c[n].forEach(c=>{c.thumb=renderThumb(c);});
  stageTabs();runLabel();setStepper();legend();
  $('#areaBox').hidden=n!==3;
  renderCands();
  if(S.c[n].length)select(Math.max(0,S.sel[n]));else{S.cur=null;clearGroup(schemeGroup);const o=labelGroup.getObjectByName('schemeLabels');if(o){labelGroup.remove(o);disposeObj(o);}clearPanels();setActions();req();}
  if(fromNext)toast(t('toast.stage',{s:t('st.'+n)}));
}
function stageTabs(){

function spark(best,total){

  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,110,24);
  if(best.length<2)return;
  const mn=Math.min(...best),mx=Math.max(...best),rg=mx-mn||1;
  const X=i=>2+i/Math.max(1,total-1)*106,Y=s=>21-(s-mn)/rg*18;

const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
function schemeCode(c){
  const g1=c.stage===1?c.g:S.pick1.g,g2=c.stage===2?c.g:c.stage===3?S.pick2.g:null;
  return 'TLAB5:'+b64e(JSON.stringify({v:5,P:formValues(),stage:c.stage,base:c.base,g1:Array.from(g1),g2:g2?Array.from(g2):null,ag:c.ag||null}));
}
function loadCode(txt){
  const m=/TLAB5:([A-Za-z0-9+/=]+)/.exec(txt.replace(/\s+/g,''));
  if(!m)throw new Error(t('err.code'));
  const d=JSON.parse(b64d(m[1]));
  if(!d||!d.P||!d.g1||!BASES.includes(d.base))throw new Error(t('err.codeBad'));
  writeForm(d.P);P=formValues();saveForm();
  setup();updateMeta();buildEnv();S.envKey=envSig(P);S.seed=null;
  const g1=Float32Array.from(d.g1),c1=mkCand(1,g1,d.base);c1.thumb=renderThumb(c1);
  S.c={1:[c1],2:[],3:[]};S.sel={1:0,2:-1,3:-1};S.pick1=null;S.pick2=null;
  const stage=clamp(+d.stage||1,1,3);
  if(stage>=2){S.pick1={g:g1,base:d.base};S.ref2=decode(g1,d.base).occ;const c2=mkCand(2,Float32Array.from(d.g2||d.g1),d.base);c2.orig=true;S.c[2]=[c2];S.sel[2]=0;}
  if(stage>=3){S.pick2={g:S.c[2][0].g,base:d.base};const c3=mkCand(3,S.pick2.g,d.base,d.ag||stdAG());c3.orig=true;S.c[3]=[c3];S.sel[3]=0;}
  S.stage=0;goStage(stage);
}

const r3=x=>Math.round(x*1000)/1000;

function toDAE(parts){

function toOBJ(parts,mtlName){

const CRC=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0;}return tb;})();

function makeZip(files){

  return g;
}
function regionCenter(cells){let x=0,z=0,y=0;for(const p of cells){const [i,yy,k]=dec(p);x+=i;z+=k;y=Math.max(y,yy);}const n=cells.length;return [(x/n+0.5)*CELL,(y+1)*G.fh+3,(z/n+0.5)*CELL];}
function schemeLabels(c){
  const st=c.st,g=new THREE.Group(),cut=S.cut;
  if(c.stage<3)for(const T of st.halls)g.add(label(hallName(T.id),T.i*CELL+T.sx/2,T.h+4,T.k*CELL+T.sz/2,4.2));
  if(c.stage===1){
    if(st.cross)g.add(label(t('lab.cross',{h:st.cross.clear*G.fh}),(G.r0+G.r1)/2*CELL,st.cross.clear*G.fh-1.5,G.k0*CELL-2,3.4));
    if(st.voidY){let best=null;for(let k=G.nz-1;k>=0&&!best;k--)for(let i=0;i<G.nx;i++)if(st.occ[ix(i,st.voidY,k)]===COLM){best=[i,k];break;}
      if(best)g.add(label(t('lab.sky'),best[0]*CELL+2.5,st.voidY*G.fh+2.5,(best[1]+1)*CELL+3,3.4));}
    if(G.rv){let rb=null;for(let y=G.ny-1;y>=1&&!rb;y--)for(let i=0;i<G.nx;i++)if(occ(st.occ[ix(i,y,G.nzS)])){rb=[i,y];break;}
      if(rb)g.add(label(t('lab.rivc',{m:G.rv}),rb[0]*CELL+2.5,rb[1]*G.fh+G.fh+3,G.D+G.rv,3.4));}
    if(st.pilL)g.add(label(t('lab.pil'),G.i0*CELL+12,G.fh/2,G.k1*CELL-2,3.4));
    for(const a of st.openList)g.add(label(t('os.'+a.type),(a.x0+a.x1)/2*CELL,1.2,(a.z0+a.z1)/2*CELL,a.type==='pass'?2.8:3.2));
  }else if(c.stage===2){
    for(const h of st.wrapInfo){const T=st.halls.find(x=>x.id===h.id);g.add(label(`${hallName(h.id)}：${t('s.'+h.status)}`,T.i*CELL+T.sx/2,T.h+5,T.k*CELL+T.sz/2,4));}
  }else if(st.alloc){
    const by=new Map();for(let p=0;p<st.tlab.length;p++){const v=st.tlab[p];if(!v)continue;const [,y]=dec(p);if(cut>=0&&y>cut)continue;if(!by.has(v))by.set(v,[]);by.get(v).push(p);}
    const done=new Set();
    const arr=[...by.entries()].sort((a,b)=>b[1].length-a[1].length);
    for(const [v,cells] of arr){const r=st.tasks[v-1];if(!r||done.has(r.id))continue;done.add(r.id);const [x,y,z]=regionCenter(cells);g.add(label(t('prog.'+r.id),x,y,z,3.4));}
    if(st.diag)for(const dh of st.diag.halls){const T=dh.H,c0=[T.i*CELL+T.sx/2,T.k*CELL+T.sz/2],off={N:[0,-T.sz/2-6],S:[0,T.sz/2+6],E:[T.sx/2+6,0],W:[-T.sx/2-6,0]};
      for(const [f,kk] of [[dh.aud,'lab.aud'],[dh.stage,'lab.stage']])g.add(label(t(kk),c0[0]+off[f][0],T.h+2,c0[1]+off[f][1],3.2));}
    for(const T of st.halls){if(cut>=0&&cut<0)continue;g.add(label(t(T.id==='big'?'prog.bigHall':'prog.smallHall'),T.i*CELL+T.sx/2,Math.min(T.h,(cut>=0?cut+1:99)*G.fh)+3,T.k*CELL+T.sz/2,3.6));}
  }
  return g;
}
function showScheme(c){
  S.cur=c;clearGroup(schemeGroup);
  schemeGroup.add(schemeObjects(c,S.xray,S.th));
  const old=labelGroup.getObjectByName('schemeLabels');if(old){labelGroup.remove(old);disposeObj(old);}
  const lg=schemeLabels(c);lg.name='schemeLabels';labelGroup.add(lg);
  updatePanels(c);req();
}
function renderThumb(c){
  const tmp=schemeObjects(c,false,false,-1);
  schemeGroup.visible=false;labelGroup.visible=false;scene.add(tmp);
  const v=viewParams();v.r*=0.9;placeCam(thumbCam,v);
  thumbR.render(scene,thumbCam);const url=thumbR.domElement.toDataURL('image/png');
  scene.remove(tmp);disposeObj(tmp);schemeGroup.visible=true;labelGroup.visible=S.labels;return url;
}
function legend(){
  const sw=(v,txt,extra)=>`<span><i class="sw" style="background:var(${v})${extra||''}"></i>${txt}</span>`;
  let h='';
  if(S.stage===1)h=sw('--mass',t('lg.mass'),';border:1px solid var(--floorline)')+`<span><i class="sw line"></i>${t('lg.hall')}</span>`+sw('--core',t('lg.core'))+sw('--road',t('lg.road'))+['fore','corner','water','pass'].map(k=>sw('--os-'+k,t('os.'+k))).join('');
  else if(S.stage===2)h=sw('--mass',t('lg.mass'),';border:1px solid var(--floorline)')+sw('--wrap-old',t('lg.wrapOld'))+sw('--wrap-new',t('lg.wrapNew'))+`<span><i class="sw line"></i>${t('lg.hall')}</span>`+sw('--core',t('lg.core'))+sw('--os-fore',t('lg.open'));
  else h=PROGS.map(id=>sw('--p-'+id,t('prog.'+id))).join('')+sw('--mass',t('prog.circ'),';border:1px solid var(--floorline)')+`<span style="grid-column:1/-1">${t('lg.ext')}</span>`;
  $('#legend').innerHTML=h;
}
function retheme(){
  if(!G.nx)return;
  const keep={...cam};buildEnv();Object.assign(cam,keep);
  if(S.cur)showScheme(S.cur);
  for(const n of [1,2,3])S.c[n].forEach(c=>{c.thumb=renderThumb(c);});renderCands();
  req();
}
function renderHelp(){$('#helpList').innerHTML=t('help.list').split('|').map(x=>`<li>${x}</li>`).join('');}
function applyLang(){
  document.documentElement.lang=LANG==='zh'?'zh-Hant':LANG;
  $$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  $$('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  $$('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
  $$('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.title=t('app.title');
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  renderHelp();floorHint();progTotalText();runLabel();setStepper();legend();
  if(G.nx){updateMeta();const keep={...cam};buildEnv();Object.assign(cam,keep);if(S.cur)showScheme(S.cur);}
  renderCands();setActions();renderHist();
  if(!S.running&&$('#progT').textContent==='')$('#progT').textContent=t('prog.ready');
}

/* ---------- 事件 ---------- */
function selectTab(id){
  if(!id)return;
  $$('.tab').forEach(tb=>{const on=tb.id===id;tb.setAttribute('aria-selected',String(on));tb.tabIndex=on?0:-1;$('#'+tb.getAttribute('aria-controls')).hidden=!on;});
}
$$('.tab').forEach(tb=>{
  tb.addEventListener('click',()=>{if(!tb.disabled)selectTab(tb.id);});
  tb.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
    const all=$$('.tab').filter(x=>!x.hidden&&!x.disabled);let j=all.indexOf(tb);if(j<0)return;
    j=(j+(e.key==='ArrowRight'?1:all.length-1))%all.length;selectTab(all[j].id);all[j].focus();});
});
/* 即時預覽：改設定就用新設定重算目前這一步的候選方案 */
let pvT=0;
function schedulePreview(){if(S.running||!cands().length)return;clearTimeout(pvT);pvT=setTimeout(preview,280);}
function preview(){
  if(S.running||!cands().length)return;
  saveNow();P=formValues();setup();updateMeta();
  const ek=envSig(P);if(ek!==S.envKey){const keep={...cam};buildEnv();Object.assign(cam,keep);req();S.envKey=ek;}
  if(S.stage>=2&&S.pick1)S.ref2=decode(S.pick1.g,S.pick1.base).occ;
  for(const c of cands()){recompute(c);c.thumb=renderThumb(c);}
  const i=Math.max(0,S.sel[S.stage]);renderCands();select(i);
  setCaption(t('cand.name',{L:L6[i]}),t('cap.applied'));
}
const fromRefine=e=>e.target&&e.target.closest&&e.target.closest('#tp-refine');
$('#form').addEventListener('input',e=>{updateOutputs();floorHint();if(e.target.id&&e.target.id.startsWith('pa_'))progTotalText();if(fromRefine(e))return;saveForm();schedulePreview();});
$('#form').addEventListener('change',e=>{if(e.target.id==='osOn')osUI();if(fromRefine(e))return;saveForm();schedulePreview();});
$('#form').addEventListener('submit',e=>{e.preventDefault();
  if(S.running){S.stop=true;$('#run').textContent=t('run.collect');return;}
  if(S.stage===1)runEvolution();
  else if(S.stage===2&&S.pick1)runEvolution({g:Float32Array.from(S.pick1.g),base:S.pick1.base,lock:[],amp:'m',mode:2});
  else if(S.stage===3)runAlloc();
});
$$('[data-all]').forEach(b=>b.addEventListener('click',()=>{$$('#'+b.dataset.all+' input').forEach(x=>x.checked=true);saveForm();schedulePreview();}));
$$('[data-none]').forEach(b=>b.addEventListener('click',()=>{$$('#'+b.dataset.none+' input').forEach(x=>{if(!x.disabled)x.checked=false;});saveForm();schedulePreview();}));
$$('[data-preset]').forEach(b=>b.addEventListener('click',()=>{const p=PRESETS[b.dataset.preset];for(const k of WKEYS)$('#w'+k).value=p[k];updateOutputs();saveForm();schedulePreview();toast(t('toast.preset',{p:b.textContent}));}));
$('#resetBtn').addEventListener('click',()=>{writeForm(DEFAULTS);try{localStorage.removeItem(STORE);}catch(e){}schedulePreview();toast(t('toast.reset'));});
$('#progReset').addEventListener('click',()=>{for(const id of PROGS){$('#pa_'+id).value=PROG_DEF[id][0];$('#pm_'+id).value=PROG_DEF[id][1];}progTotalText();saveForm();schedulePreview();});
$$('.nudge').forEach(nd=>nd.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const h=nd.dataset.hall,d=b.dataset.d,fx=$('#h'+h+'X'),fy=$('#h'+h+'Y');
  const step=(el,dv)=>{el.value=clamp((parseFloat(el.value)||0)+dv,+el.min,+el.max);};
  if(d==='W')step(fx,-CELL);if(d==='E')step(fx,CELL);if(d==='N')step(fy,-CELL);if(d==='S')step(fy,CELL);
  saveForm();schedulePreview();
  if(!cands().length){P=formValues();setup();toast(t('toast.nudge',{h:hallName(h==='B'?'big':'small'),x:fx.value,y:fy.value}));}
}));
$('#refineGo').addEventListener('click',()=>{
  const c=curCand();if(!c||S.running||S.stage!==1)return;
  const lock=LOCKS.filter(k=>$('#lk_'+k).checked);
  const amp=(document.querySelector('input[name=amp]:checked')||{}).value||'m';
  toast(t('toast.refine',{L:L6[S.sel[1]],a:'amp.'+amp})+(lock.length?t('toast.keep',{list:lock.map(k=>'lk.'+k)}):t('toast.all')));
  runEvolution({g:Float32Array.from(c.g),base:c.base,lock,amp,mode:1});
});
$('#nextBtn').addEventListener('click',()=>{if(S.stage<3)goStage(S.stage+1,true);});
$$('.step').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.step;if(n!==S.stage&&!b.disabled)goStage(n,false);}));
$('#hist').addEventListener('click',e=>{const l=e.target.closest('[data-hload]');if(l){histRestore(+l.dataset.hload);return;}const p=e.target.closest('[data-hpin]');if(p){const h=histLoad(),x=h[+p.dataset.hpin];if(x){x.pin=!x.pin;histSave(h);renderHist();}}});
$('#histClear').addEventListener('click',()=>{histSave(histLoad().filter(x=>x.pin));renderHist();toast(t('hist.cleared'));});
$('#helpBtn').addEventListener('click',e=>{const h=$('#help');h.hidden=!h.hidden;e.currentTarget.setAttribute('aria-expanded',String(!h.hidden));});
$('#cands').addEventListener('click',e=>{const b=e.target.closest('.cand');if(b)select(+b.dataset.i);});
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
const tog=(id,key,fn)=>$('#'+id).addEventListener('click',e=>{S[key]=!S[key];e.currentTarget.setAttribute('aria-pressed',S[key]);fn();});
tog('tTh','th',()=>{if(S.cur)showScheme(S.cur);});
tog('tXray','xray',()=>{if(S.xray&&!S.th){S.th=true;$('#tTh').setAttribute('aria-pressed','true');}if(S.cur)showScheme(S.cur);});
tog('tLabel','labels',()=>{labelGroup.visible=S.labels;req();});
tog('tCtx','ctx',()=>{ctxGroup.visible=S.ctx;req();});
$('#cut').addEventListener('change',e=>{S.cut=+e.target.value;if(S.cur)showScheme(S.cur);});
$('#refineBtn').addEventListener('click',()=>{if(S.sel[1]<0)return;selectTab('tb-refine');$('#tb-refine').focus();if(window.innerWidth<=960)$('#form').scrollIntoView({behavior:'smooth',block:'start'});});
$('#codeBtn').addEventListener('click',()=>{const c=curCand();if(c)copyText(schemeCode(c),t('label.code'));});
$('#codeLoad').addEventListener('click',()=>{
  const m=$('#codeMsg');
  if(S.running){m.textContent=t('msg.stopFirst');m.className='msg err';return;}
  try{loadCode($('#codeIn').value);m.textContent=t('msg.loaded');m.className='msg';}
  catch(err){console.error(err);m.textContent=err.message||t('err.code');m.className='msg err';}
});
$$('[data-export]').forEach(b=>b.addEventListener('click',async()=>{
  if(b.disabled)return;b.disabled=true;
  try{await doExport(b.dataset.export);}catch(err){console.error(err);toast(t('toast.exportFail'));}
  finally{b.disabled=!curCand();}
}));
$$('[data-lang]').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;try{localStorage.setItem(LSTORE,LANG);}catch(e){}applyLang();}));
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',retheme);
  new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}catch(e){}

buildProgRows();
const DEFAULTS=formValues();
writeForm(loadSaved());
try{const l=localStorage.getItem(LSTORE);if(l&&LI[l]!=null)LANG=l;else{const n=(navigator.language||'zh').toLowerCase();LANG=n.startsWith('ja')?'ja':n.startsWith('zh')?'zh':'en';}}catch(e){}
applyLang();stageTabs();setActions();renderHist();
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});
}
try{initThree();runEvolution();}
catch(err){console.error(err);$('#stage').innerHTML=`<p class="empty" style="margin:16px">${t('err.webgl')}</p>`;}
})();
</script>
